{% extends "base.html" %}
{% block page_title %}Nouveau jour férié{% endblock %}
{% block content %}
<div class="td-card" style="max-width:480px;">
  <div class="td-card-title" style="margin-top:0;">Nouveau jour férié</div>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <label class="td-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="td-alert td-alert-error">{{ field.errors|striptags }}</div>{% endif %}
    {% endfor %}
    <button class="td-btn td-btn-primary" style="margin-top:14px;">Enregistrer</button>
    <a href="{% url 'payroll:policy_view' %}" class="td-btn td-btn-outline">Annuler</a>
  </form>
</div>
{% endblock %}
