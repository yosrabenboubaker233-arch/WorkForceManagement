{% extends "base.html" %}
{% block page_title %}Modifier le salaire — {{ employee }}{% endblock %}
{% block content %}
<div class="td-card" style="max-width:560px;">
  <div class="td-card-title" style="margin-top:0;">{{ employee }}</div>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <label class="td-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="td-alert td-alert-error">{{ field.errors|striptags }}</div>{% endif %}
    {% endfor %}
    <button class="td-btn td-btn-primary">Enregistrer</button>
    <a href="{% url 'payroll:detail' employee.pk %}" class="td-btn td-btn-outline">Annuler</a>
  </form>
</div>
{% endblock %}
