apiVersion: apps/v1
kind: Deployment
metadata:
  name: workforce-django-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workforce-django
  template:
    metadata:
      labels:
        app: workforce-django
    spec:
      containers:
      - name: workforce-django
        image: yosra158/workforce-django-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        hostPath:
          path: /data/workforce
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: workforce-django-service
spec:
  type: NodePort
  selector:
    app: workforce-django
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30000
